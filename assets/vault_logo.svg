<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="v-shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="v-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="v-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="v-core-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield Plate -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="13" fill="url(#v-shield-bg)" stroke="url(#v-accent-grad)" stroke-width="1.8"/>
  <rect x="4" y="4" width="40" height="40" rx="11.5" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Rotating Vault Track -->
  <circle cx="24" cy="24" r="14.5" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1.5" stroke-dasharray="3.5 2.5"/>
  <circle cx="24" cy="24" r="11" fill="rgba(15, 23, 42, 0.95)" stroke="url(#v-accent-grad)" stroke-width="1.6"/>

  <!-- Glowing Memory Cloud Core -->
  <path d="M19 25.5a3 3 0 0 1 5.8-1 2.5 2.5 0 0 1 4.2 2 2.5 2.5 0 0 1-2.5 2.5h-7a2.5 2.5 0 0 1-.5-3.5z" fill="url(#v-glow-grad)" filter="url(#v-core-shadow)"/>

  <!-- Central Keyhole & Biometric Lock Ring -->
  <circle cx="24" cy="24" r="4.2" fill="#070c18" stroke="#00f2fe" stroke-width="1.2"/>
  <circle cx="24" cy="24" r="1.7" fill="#00f2fe"/>

  <!-- Precision Corner Rivets -->
  <circle cx="7.5" cy="7.5" r="1.3" fill="rgba(255,255,255,0.35)"/>
  <circle cx="40.5" cy="7.5" r="1.3" fill="rgba(255,255,255,0.35)"/>
  <circle cx="7.5" cy="40.5" r="1.3" fill="rgba(255,255,255,0.35)"/>
  <circle cx="40.5" cy="40.5" r="1.3" fill="rgba(255,255,255,0.35)"/>
</svg>
